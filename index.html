<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Album</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Photo Album</h1>
    <p>Search your photos in plain English, e.g. "show me dogs and cats".</p>
  </header>

  <main>
    <section class="card">
      <h2>Search</h2>
      <form id="search-form">
        <input id="search-input" type="text" placeholder="show me photos with trees" required />
        <button type="submit">Search</button>
      </form>
      <p id="search-status" class="status"></p>
      <div id="results" class="grid"></div>
    </section>

    <section class="card">
      <h2>Upload</h2>
      <form id="upload-form">
        <input id="upload-file" type="file" accept="image/*" required />
        <input id="upload-labels" type="text" placeholder="Custom labels, comma separated (e.g. Sam, Sally)" />
        <button type="submit">Upload</button>
      </form>
      <p id="upload-status" class="status"></p>
    </section>
  </main>

  <!-- API Gateway generated JavaScript SDK (SDK1). Copy the generated files into sdk/. -->
  <script src="sdk/lib/axios/dist/axios.standalone.js"></script>
  <script src="sdk/lib/CryptoJS/rollups/crypto-js.js"></script>
  <script src="sdk/lib/CryptoJS/rollups/sha256.js"></script>
  <script src="sdk/lib/CryptoJS/components/hmac.js"></script>
  <script src="sdk/lib/CryptoJS/components/enc-base64.js"></script>
  <script src="sdk/lib/url-template/url-template.js"></script>
  <script src="sdk/lib/apiGatewayCore/sigV4Client.js"></script>
  <script src="sdk/lib/apiGatewayCore/apiGatewayClient.js"></script>
  <script src="sdk/lib/apiGatewayCore/simpleHttpClient.js"></script>
  <script src="sdk/lib/apiGatewayCore/utils.js"></script>
  <script src="sdk/apigClient.js"></script>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
